# The local-SDK switch: the same app, built against the GraineInApp sources at $GRAINE_IOS_SDK_PATH
# instead of the published package. Run ./use-local-sdk.sh, which sets the path and generates
# GraineDemoLocal.xcodeproj (git-ignored) — the committed GraineDemo.xcodeproj is left alone.
include:
  - project.yml
name: GraineDemoLocal
packages:
  GraineInApp:
    path: ${GRAINE_IOS_SDK_PATH}
