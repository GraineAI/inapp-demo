# The local-SDK switch: the same app, built against the iOS SDK's sources instead of the published packages —
# GraineInApp at $GRAINE_IOS_SDK_PATH and its WebRTC module, GraineInAppRTC, at $GRAINE_IOS_RTC_SDK_PATH, from one
# source tree (the module talks to GraineInApp through its SPI, so the two are always the same version). Run
# ./use-local-sdk.sh, which sets both paths and generates iosAppLocal.xcodeproj (git-ignored) — the committed
# iosApp.xcodeproj is left alone. The Kotlin side follows graine.kmpSdkDir in ../local.properties.
include:
  - project.yml
name: iosAppLocal
packages:
  GraineInApp:
    path: ${GRAINE_IOS_SDK_PATH}
  GraineInAppRTC:
    path: ${GRAINE_IOS_RTC_SDK_PATH}
